<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品集展示墙</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #333;
      font-size: 2.5rem;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    .photo-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px 0;
    }

    .photo-card {
      flex: 1 1 200px;
      max-width: 300px;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    .photo-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .photo-card:hover img {
      transform: scale(1.05);
    }

    .photo-card .title {
      padding: 15px;
      text-align: center;
      font-weight: bold;
      color: #333;
      background-color: #f9f9f9;
      border-top: 1px solid #eee;
    }

    @media (max-width: 768px) {
      .photo-card {
        flex: 1 1 150px;
        max-width: 250px;
      }

      h1 {
        font-size: 2rem;
      }
    }

    @media (max-width: 480px) {
      .photo-card {
        flex: 1 1 100%;
        max-width: 100%;
      }

      h1 {
        font-size: 1.5rem;
      }

      .photo-grid {
        gap: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>作品集展示墙</h1>
    <div class="photo-grid">
      <div class="photo-card">
        <img
          src="./photo/firstmeet.png"
          alt="首次出金">
        <div class="title">首次出金</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/liuying.jpg"
          alt="流萤">
        <div class="title">流萤</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/smiling.jpg"
          alt="流萤微笑">
        <div class="title">流萤微笑</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/goodmorning.jpg"
          alt="早上好">
        <div class="title">早上好</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/goodevening.jpg"
          alt="晚上好">
        <div class="title">晚上好</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/lucky.jpg"
          alt="十连双金">
        <div class="title">十连双金</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/firstmeet.png"
          alt="首次出金">
        <div class="title">首次出金</div>
      </div>
      <div class="photo-card">
        <img
          src="./photo/endfield.png"
          alt="终末地">
        <div class="title">终末地</div>
      </div>
    </div>
  </div>
</body>

</html>
